server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings,runtimeStats
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0  # 100% of traces are sampled

github:
  api-version: 2022-11-28
  url: https://api.github.com
  branch: develop
  owner: davidr69
  repo: api_access

kafka:
  topic: "serverless-topic"
  app-header: "serverless-app-name"
  params-header: "serverless-params"

app:
  required-header: 'serverless-app-name'

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: groovletCP
      connection-test-query: SELECT 1
      minimum-idle: 3
      maximum-pool-size: 20
      idle-timeout: 10000
  kafka:
    bootstrap-servers: kafka.lavacro.net:9092
    consumer:
      group-id: 'serverless-consumer-group'
      auto-offset-reset: latest
      max-poll-records: 10
      enable-auto-commit: false
      client-id: execution-engine
      key-deserializer: 'org.apache.kafka.common.serialization.StringDeserializer'
      value-deserializer: 'org.springframework.kafka.support.serializer.JsonDeserializer'
      properties:
        spring.deserializer.value.delegate.class: 'org.springframework.kafka.support.serializer.JsonDeserializer'
        spring.json.trusted.packages: "net.lavacro.serverless.kafka,com.fasterxml.jackson.databind"
        spring.json.value.default.type: "java.util.Map"
    listener:
      ack-mode: manual
      concurrency: 1

